<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>مرتب‌سازی ادغامی (Merge Sort) نزولی</title>
  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      text-align: center;
      background: #f0f0f0;
      padding: 20px;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      margin-top: 40px;
      height: 300px;
    }
    .bar {
      width: 40px;
      background-color: darkorange;
      color: white;
      text-align: center;
      border-radius: 5px;
      transition: all 0.5s ease;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>مرتب‌سازی ادغامی (نزولی)Mergesort</h1>
<div class="container" id="barContainer"></div>
<button onclick="startMergeSort()">شروع مرتب‌سازی</button>

<script>
  const numbers = [45, 96, 17, 34, 5, 12, 85, 101];
  const container = document.getElementById("barContainer");

  function renderBars(arr) {
    container.innerHTML = "";
    arr.forEach(num => {
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.height = (num * 2) + "px";
      bar.textContent = num;
      container.appendChild(bar);
    });
  }

  async function mergeSort(arr) {
    if (arr.length <= 1) return arr;

    const mid = Math.floor(arr.length / 2);
    const left = await mergeSort(arr.slice(0, mid));
    const right = await mergeSort(arr.slice(mid));

    return await merge(left, right);
  }

  async function merge(left, right) {
    let result = [];

    while (left.length && right.length) {
      if (left[0] > right[0]) {
        result.push(left.shift());
      } else {
        result.push(right.shift());
      }
      renderBars([...result, ...left, ...right]);
      await delay(600);
    }

    result = [...result, ...left, ...right];
    renderBars(result);
    await delay(600);
    return result;
  }

  async function startMergeSort() {
    let sorted = await mergeSort([...numbers]);
    console.log("مرتب‌شده:", sorted);
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  renderBars(numbers); // نمای اولیه
</script>

</body>
</html>
