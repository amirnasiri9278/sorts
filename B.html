<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>مرتب‌سازی انتخابی نزولی</title>
  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      text-align: center;
      background: #f0f0f0;
      padding: 20px;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      margin-top: 40px;
      height: 300px;
    }
    .bar {
      width: 40px;
      background-color: steelblue;
      color: white;
      text-align: center;
      border-radius: 5px;
      transition: all 0.5s;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>SELECTION SORT</h1>
<div class="container" id="barContainer"></div>
<button onclick="startSort()">شروع مرتب‌سازی</button>

<script>
  const numbers = [45, 96, 17, 34, 5, 12, 85, 101];
  const container = document.getElementById("barContainer");

  function renderBars(arr) {
    container.innerHTML = "";
    arr.forEach(num => {
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.height = (num * 2) + "px";
      bar.textContent = num;
      container.appendChild(bar);
    });
  }

  async function startSort() {
    let arr = [...numbers];
    let n = arr.length;

    for (let i = 0; i < n - 1; i++) {
      let maxIdx = i;
      for (let j = i + 1; j < n; j++) {
        if (arr[j] > arr[maxIdx]) {
          maxIdx = j;
        }
      }
      if (maxIdx !== i) {
        [arr[i], arr[maxIdx]] = [arr[maxIdx], arr[i]];
        renderBars(arr);
        await delay(700);
      }
    }

    console.log("مرتب‌شده:", arr);
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  renderBars(numbers);
</script>

</body>
</html>
