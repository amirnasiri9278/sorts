<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>مرتب‌سازی درجی نزولی</title>
  <style>
    body {
      font-family: sans-serif;
      direction: rtl;
      text-align: center;
      background: #f0f0f0;
      padding: 20px;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      margin-top: 40px;
      height: 300px;
    }
    .bar {
      width: 40px;
      background-color: teal;
      color: white;
      text-align: center;
      border-radius: 5px;
      transition: all 0.4s ease;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h1>مرتب‌سازی درجی (نزولی)insertion sort</h1>
<div class="container" id="barContainer"></div>
<button onclick="startSort()">شروع مرتب‌سازی</button>

<script>
  const numbers = [45, 96, 17, 34, 5, 12, 85, 101];
  const container = document.getElementById("barContainer");

  function renderBars(arr) {
    container.innerHTML = "";
    arr.forEach(num => {
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.style.height = (num * 2) + "px";
      bar.textContent = num;
      container.appendChild(bar);
    });
  }

  async function startSort() {
    let arr = [...numbers];
    for (let i = 1; i < arr.length; i++) {
      let key = arr[i];
      let j = i - 1;

      while (j >= 0 && arr[j] < key) {
        arr[j + 1] = arr[j];
        j--;
        renderBars(arr);
        await delay(500);
      }
      arr[j + 1] = key;
      renderBars(arr);
      await delay(500);
    }
    console.log("مرتب‌شده:", arr);
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  renderBars(numbers);
</script>

</body>
</html>
